name: CI
on:
  pull_request:
  push:
    branches: [main, "0.*"]
  workflow_dispatch:
    inputs:
      run_release_smoke:
        description: Download a published release and run its first-boot smoke
        required: false
        type: boolean
        default: false
      release_tag:
        description: Published release tag to validate when run_release_smoke is true
        required: false
        type: string
        default: v0.11.0
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      full: ${{ steps.plan.outputs.full }}
      ui: ${{ steps.plan.outputs.ui }}
      recipes: ${{ steps.plan.outputs.recipes }}
      llama: ${{ steps.plan.outputs.llama }}
      daemon_e2e: ${{ steps.plan.outputs.daemon_e2e }}
      cli_e2e: ${{ steps.plan.outputs.cli_e2e }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify change selection
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Select checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python scripts/ci/select_checks.py --full
          else
            python scripts/ci/select_checks.py --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  rust-tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start measurement
        run: python scripts/ci/report_build.py start
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Cache Cargo dependencies
        id: cache
        uses: ./.github/actions/cargo-cache
        with:
          variant: ci-ubuntu-debug-default
      - name: Cargo test (workspace or affected packages)
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          args=(--workspace)
          if [[ "$FULL" != true ]]; then
            args=()
            while IFS= read -r package; do args+=(-p "$package"); done < <(jq -r '.[]' <<< "$PACKAGES")
            if [[ ${#args[@]} == 0 ]]; then echo "::error::Empty Rust selection"; exit 1; fi
          fi
          cargo test --locked "${args[@]}"
      - name: Validate cookbook recipes
        if: needs.changes.outputs.recipes == 'true'
        run: |
          pip install jsonschema
          python scripts/validate-cookbook-recipes.py
      - name: Validate feature registry
        run: python scripts/validate-feature-registry.py

      - name: E2E tests (daemon)
        if: needs.changes.outputs.daemon_e2e == 'true'
        env:
          RUN_E2E: "1"
        run: cargo test --locked -p akasha-daemon --test e2e_health --test e2e_api_smoke -- --ignored --test-threads=1
      - name: E2E tests (CLI)
        if: needs.changes.outputs.cli_e2e == 'true'
        env:
          RUN_E2E: "1"
        run: cargo test --locked -p akasha-cli --test cli_smoke -- --ignored
      - name: Prepare daemon for UI tests
        if: needs.changes.outputs.ui == 'true'
        run: cargo build --locked -p akasha-daemon
      - name: Share daemon with UI tests
        if: needs.changes.outputs.ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-ui-daemon
          path: target/debug/akasha-daemon
          retention-days: 1
          if-no-files-found: error
      - name: Report build/cache
        if: always()
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: python scripts/ci/report_build.py finish --cache-hit '${{ steps.cache.outputs.cache-hit }}'
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ci-rust-measurements
          path: ci-build-report.json
          retention-days: 14

  ui-e2e:
    needs: [changes, rust-tests]
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.ui == 'true' &&
      (needs.rust-tests.result == 'success' || needs.rust-tests.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Install Rust (UI-only change)
        if: needs.rust-tests.result == 'skipped'
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Cache Cargo dependencies (UI-only change)
        if: needs.rust-tests.result == 'skipped'
        uses: ./.github/actions/cargo-cache
        with:
          variant: ci-ubuntu-debug-default
      - name: Reuse daemon built by Rust checks
        if: needs.rust-tests.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ci-ui-daemon
          path: target/debug
      - name: Build daemon (UI-only change)
        if: needs.rust-tests.result == 'skipped'
        run: cargo build --locked -p akasha-daemon
      - name: Restore executable permission after artifact download
        run: chmod +x target/debug/akasha-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: apps/akasha-ui/package-lock.json
      - name: Install UI deps and Playwright browser
        working-directory: apps/akasha-ui
        run: |
          npm ci
          npm run test:e2e:install
      - name: UI unit tests
        working-directory: apps/akasha-ui
        run: npm run test
      - name: Playwright E2E
        working-directory: apps/akasha-ui
        run: npm run test:e2e

  evals-mock-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-evals-mock-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-evals-mock-

      - name: Run Akasha evals (mock CI profile)
        env:
          AKASHA_SPEC_DIR: ${{ github.workspace }}/spec
          AKASHA_EVALS_PROFILE: mock-ci
          AKASHA_EVALS_JSON: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: cargo run -p akasha-evals --release

      - name: Test isolated real-agentic eval harness
        run: python3 spec/dev/quality/test_real_agentic_eval.py
      - name: Validate consumer acceptance corpus and evidence gate
        run: |
          python3 spec/dev/quality/consumer_beta_eval.py --validate-corpus
          python3 -m unittest discover -s spec/dev/quality -p test_consumer_beta_eval.py -v
  release-artifact-first-boot-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install gh (release download)
        run: |
          sudo apt-get update
          sudo apt-get install -y gh libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xdotool x11-utils openbox scrot tesseract-ocr

      - name: First-boot smoke (published Linux CPU zip)
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.11.0' }}
          GH_TOKEN: ${{ github.token }}
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/release-first-boot
        run: bash scripts/smoke-release-artifact-linux.sh

      - name: Preserve first-boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-first-boot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-first-boot
          if-no-files-found: warn
          retention-days: 7

  embedded-llama-cpp-linux:
    needs: changes
    if: needs.changes.outputs.llama == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps (llama.cpp)
        run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config libssl-dev
      - uses: ./.github/actions/cargo-cache
        with:
          variant: ci-ubuntu-debug-llama-cpp
      - name: Build and test embedded-llm with llama-cpp
        run: |
          cargo build --locked -p akasha-embedded-llm --features llama-cpp
          cargo test --locked -p akasha-embedded-llm --features llama-cpp

  windows-updater:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Windows PowerShell updater and component publication
        run: python -m unittest discover -s scripts/ci/tests -p test_package_updates.py -v

  consumer-beta-protection-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/cargo-cache
        with:
          variant: consumer-beta-sqlcipher-windows
      - name: Prepare pinned Perl for vendored OpenSSL
        shell: pwsh
        run: ./scripts/ci/prepare-sqlcipher-windows.ps1
      - name: Test SQLCipher and portable backup protection
        run: |
          cargo test --locked -p akasha-store --features memory-sqlcipher --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p akasha-vault --lib protected_archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p akasha-daemon --no-default-features --features consumer-beta --lib privacy::
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p akasha-daemon --no-default-features --features consumer-beta --lib profile_backup::
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build pinned PDFium and Tesseract runtime
        shell: pwsh
        run: |
          python scripts/prepare-ocr-runtime.py --output "$env:RUNNER_TEMP/ocr-runtime"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lock = (Get-FileHash "$env:RUNNER_TEMP/ocr-runtime/runtime-lock.json" -Algorithm SHA256).Hash.ToLower()
          "AKASHA_OCR_LOCK_SHA256=$lock" >> $env:GITHUB_ENV
      - name: Exercise native parsing and document tasks
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0 reportlab==4.4.4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked -p akasha-daemon --no-default-features --features consumer-beta
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python spec/dev/quality/document_worker_audit.py --binary target/debug/akasha-daemon.exe --runtime "$env:RUNNER_TEMP/ocr-runtime" --output "$env:RUNNER_TEMP/document-worker.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python spec/dev/quality/document_workflow_audit.py --controlled --binary target/debug/akasha-daemon.exe --runtime "$env:RUNNER_TEMP/ocr-runtime" --fixtures "$env:RUNNER_TEMP/document-fixtures-éété" --output "$env:RUNNER_TEMP/document-workflow.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-document-receipts-windows
          path: |
            ${{ runner.temp }}/document-worker.json
            ${{ runner.temp }}/document-workflow.json
            ${{ runner.temp }}/ocr-runtime/runtime-lock.json

  # Preserve the existing required "test" check, including docs-only changes.
  test:
    if: always()
    needs: [changes, rust-tests, ui-e2e, windows-updater, consumer-beta-protection-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required outcomes
        env:
          PLAN_RESULT: ${{ needs.changes.result }}
          PROTECTION_RESULT: ${{ needs.consumer-beta-protection-windows.result }}
          RUST_RESULT: ${{ needs.rust-tests.result }}
          UI_RESULT: ${{ needs.ui-e2e.result }}
          UPDATE_RESULT: ${{ needs.windows-updater.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          UI_REQUIRED: ${{ needs.changes.outputs.ui }}
        run: |
          [[ "$PLAN_RESULT" == success ]]
          [[ "$UPDATE_RESULT" == success ]]
          if [[ "$RUST_REQUIRED" == true ]]; then [[ "$PROTECTION_RESULT" == success ]]; else [[ "$PROTECTION_RESULT" == skipped ]]; fi
          if [[ "$RUST_REQUIRED" == true ]]; then [[ "$RUST_RESULT" == success ]]; else [[ "$RUST_RESULT" == skipped ]]; fi
          if [[ "$UI_REQUIRED" == true ]]; then [[ "$UI_RESULT" == success ]]; else [[ "$UI_RESULT" == skipped ]]; fi
