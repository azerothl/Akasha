# Build release binaries for Akasha (CLI + daemon + TUI) and publish to GitHub Releases.
# Trigger: push a tag like v0.1.0 or v1.0.0 (e.g. git tag v0.1.0 && git push origin v0.1.0),
# or run manually from the Actions tab (workflow_dispatch) with a version input.
# Users can then download the zip for their OS from the Releases page (no compilation needed).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0). Used when running manually; must match an existing tag or the release will be created from the current branch.'
        required: true
        type: string

jobs:
  verify-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify embedded version matches git tag
        run: |
          set -e
          REF="${{ github.ref }}"
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "Not a tag ref ($REF); skipping version check (e.g. workflow_dispatch)."
            exit 0
          fi
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(python3 -c "
          import re
          from pathlib import Path
          t = Path('Cargo.toml').read_text(encoding='utf-8')
          m = re.search(r'\[workspace\.package\]\s*\nversion = \"([^\"]+)\"', t)
          print(m.group(1) if m else '')
          ")
          PKG_VER=$(jq -r .version apps/akasha-ui/package.json)
          TAURI_VER=$(jq -r .version apps/akasha-ui/src-tauri/tauri.conf.json)
          if [[ -z "$CARGO_VER" ]]; then
            echo "::error::Could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [[ "$TAG_VER" != "$CARGO_VER" ]]; then
            echo "::error::Tag v$TAG_VER does not match Cargo.toml workspace.package version ($CARGO_VER). Run workflow 'Sync release version' first, then tag."
            exit 1
          fi
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "::error::Tag v$TAG_VER does not match apps/akasha-ui/package.json ($PKG_VER)."
            exit 1
          fi
          if [[ "$TAG_VER" != "$TAURI_VER" ]]; then
            echo "::error::Tag v$TAG_VER does not match apps/akasha-ui/src-tauri/tauri.conf.json ($TAURI_VER)."
            exit 1
          fi
          echo "OK: tag v$TAG_VER matches Cargo workspace, package.json, and tauri.conf.json"

  build:
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: akasha-linux-x86_64
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: akasha-macos-x86_64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: akasha-macos-aarch64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: akasha-windows-x86_64
            ext: .exe
            cuda: false
            daemon_features: embedded,embeddings-tract,embedded-baguettotron
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: akasha-windows-x86_64-cuda
            ext: .exe
            cuda: true
            daemon_features: embedded,embeddings-tract,embedded-baguettotron,embedded-llama-cpp,embedded-llama-cpp-cuda

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ matrix.artifact_name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-${{ matrix.artifact_name }}-

      - name: Build CLI and TUI
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-cli -p akasha-tui

      - name: Build daemon (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-daemon

      # macOS: ort-sys has no prebuilt binaries for x86_64-apple-darwin (and can be fragile on aarch64). Use tract backend like Windows.
      - name: Build daemon (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-daemon --no-default-features --features embedded,embeddings-tract,embedded-baguettotron

      - name: Install CUDA toolkit (Windows CUDA artifact)
        if: matrix.os == 'windows-latest' && matrix.cuda == true
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.6.0'

      - name: Install LLVM and CMake (Windows CUDA artifact)
        if: matrix.os == 'windows-latest' && matrix.cuda == true
        run: choco install llvm cmake -y

      - name: Build daemon (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-daemon --no-default-features --features ${{ matrix.daemon_features }}

      - name: Prepare artifact (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging/docs staging/scripts staging/spec
          cp target/${{ matrix.target }}/release/akasha${{ matrix.ext }} staging/
          cp target/${{ matrix.target }}/release/akasha-daemon${{ matrix.ext }} staging/
          cp target/${{ matrix.target }}/release/akasha-tui${{ matrix.ext }} staging/
          cp docs/user_guide_final.md staging/docs/user_guide.md
          cp spec/tools_policy.example.yaml spec/voice_router.example.yaml spec/llm_router.example.yaml spec/embedded_models.json staging/spec/
          cp scripts/install.sh scripts/setup.sh staging/scripts/
          mkdir -p staging/playwright-runner
          cp -R scripts/playwright-runner/. staging/playwright-runner/
          rm -rf staging/playwright-runner/node_modules
          chmod +x staging/* staging/scripts/install.sh staging/scripts/setup.sh

      - name: Smoke test staging layout
        if: matrix.os != 'windows-latest'
        run: bash scripts/smoke-release-staging.sh staging

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging, staging\docs, staging\scripts, staging\spec | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/akasha.exe" -Destination staging/
          Copy-Item "target/${{ matrix.target }}/release/akasha-daemon.exe" -Destination staging/
          Copy-Item "target/${{ matrix.target }}/release/akasha-tui.exe" -Destination staging/
          Copy-Item docs/user_guide_final.md -Destination staging/docs/user_guide.md
          Copy-Item spec\tools_policy.example.yaml, spec\voice_router.example.yaml, spec\llm_router.example.yaml, spec\embedded_models.json -Destination staging\spec\
          Copy-Item scripts/install.ps1 -Destination staging/scripts/
          Copy-Item scripts/setup.ps1 -Destination staging/scripts/
          New-Item -ItemType Directory -Force -Path staging\playwright-runner | Out-Null
          Copy-Item -Path scripts\playwright-runner\* -Destination staging\playwright-runner\ -Recurse -Force
          Remove-Item -Recurse -Force staging\playwright-runner\node_modules -ErrorAction SilentlyContinue

      - name: Smoke test staging layout
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/smoke-release-staging.ps1 staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/

  build-tauri:
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: akasha-ui-linux
          - os: macos-latest
            artifact_name: akasha-ui-macos
          - os: windows-latest
            artifact_name: akasha-ui-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: apps/akasha-ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (Tauri)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/akasha-ui/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('apps/akasha-ui/src-tauri/Cargo.lock', 'apps/akasha-ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        working-directory: apps/akasha-ui
        run: npm ci

      - name: Ensure Tauri icon exists
        run: |
          node scripts/gen-ico.js

      - name: Build Tauri app
        working-directory: apps/akasha-ui
        run: npx tauri build

      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/akasha-ui/src-tauri/target/release/bundle/

  release:
    needs: [build, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          set -e
          RELEASE_DIR="$(pwd)/release"
          mkdir -p "$RELEASE_DIR"

          # download-artifact@v4 may place artifacts in artifacts/ or artifacts/artifact/ (see actions/download-artifact#356)
          ARTIFACTS_ROOT=artifacts
          if [ -d "artifacts/artifact" ] && [ -n "$(ls -A artifacts/artifact 2>/dev/null)" ]; then
            ARTIFACTS_ROOT=artifacts/artifact
          fi
          echo "Using artifacts root: $ARTIFACTS_ROOT"
          ls -la "$ARTIFACTS_ROOT" || true
          ARTIFACT_COUNT=$(find "$ARTIFACTS_ROOT" -maxdepth 1 -type d -name 'akasha-*' 2>/dev/null | wc -l)
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No artifact directories (akasha-*) found under $ARTIFACTS_ROOT. Ensure build and build-tauri jobs completed and uploaded artifacts."
            exit 1
          fi

          for dir in "$ARTIFACTS_ROOT"/akasha-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$RELEASE_DIR/${name}.zip" .)
          done

          for dir in "$ARTIFACTS_ROOT"/akasha-ui-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$RELEASE_DIR/${name}.zip" .)
          done

          # Full installer zips: CLI + setup scripts + UI bundle per OS
          for cli_dir in "$ARTIFACTS_ROOT"/akasha-windows-x86_64 "$ARTIFACTS_ROOT"/akasha-linux-x86_64 "$ARTIFACTS_ROOT"/akasha-macos-x86_64 "$ARTIFACTS_ROOT"/akasha-macos-aarch64; do
            [ -d "$cli_dir" ] || continue
            base=$(basename "$cli_dir")
            suffix=${base#akasha-}
            ui_name=akasha-ui-linux
            case "$suffix" in
              windows-x86_64) ui_name=akasha-ui-windows ;;
              linux-x86_64)   ui_name=akasha-ui-linux ;;
              macos-*)        ui_name=akasha-ui-macos ;;
            esac
            full_name="akasha-full-${suffix}"
            mkdir -p "$RELEASE_DIR/${full_name}"
            cp -r "$cli_dir"/* "$RELEASE_DIR/${full_name}/"
            if [ -d "$ARTIFACTS_ROOT/${ui_name}" ]; then
              mkdir -p "$RELEASE_DIR/${full_name}/ui"
              cp -r "$ARTIFACTS_ROOT/${ui_name}"/* "$RELEASE_DIR/${full_name}/ui/"
            fi
            # README at root of full zip (all platforms)
            printf 'To install: Windows: double-click INSTALL.cmd. Linux/macOS: in a terminal, run: chmod +x scripts/setup.sh && ./scripts/setup.sh\n' > "$RELEASE_DIR/${full_name}/README.txt"
            # Windows full zip: entry point that bypasses ExecutionPolicy for setup.ps1
            if [ "$suffix" = "windows-x86_64" ]; then
              printf '%s\r\n' '@echo off' 'powershell -ExecutionPolicy Bypass -File "%~dp0scripts\setup.ps1"' 'pause' > "$RELEASE_DIR/${full_name}/INSTALL.cmd"
            fi
            (cd "$RELEASE_DIR/${full_name}" && zip -r "$RELEASE_DIR/${full_name}.zip" .)
            rm -rf "$RELEASE_DIR/${full_name}"
          done

          echo "Contents of release/ after zipping:"
          ls -la "$RELEASE_DIR/" || true

          shopt -s nullglob
          RELEASE_FILES=("$RELEASE_DIR"/*.zip)
          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "::error::No zip files produced in release/. Check that build and build-tauri jobs uploaded artifacts and that artifact paths match (see ARTIFACTS_ROOT=$ARTIFACTS_ROOT)."
            exit 1
          fi

          # Align tags with origin. Plain `git fetch --tags` fails with
          # "would clobber existing tag" when checkout left a lightweight tag
          # and origin has an annotated tag (or the tag moved) for the same name.
          git fetch --tags --force
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists locally/remote."
          else
            echo "::error::Tag $VERSION does not exist. Create the tag first (e.g. git tag $VERSION && git push origin $VERSION), or use a new version."
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Use a new version (e.g. v0.4.1) or delete the release and tag on GitHub first. Avoid force-pushing tags (would clobber existing tag)."
            exit 1
          fi

          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          NOTES_OPT="--generate-notes"
          [ -n "$PREV_TAG" ] && NOTES_OPT="$NOTES_OPT --notes-start-tag $PREV_TAG"

          gh release create "$VERSION" \
            --title "$VERSION" \
            $NOTES_OPT \
            "${RELEASE_FILES[@]}"

  # Notify the site repo (azerothl/Akasha_app) so it can update releases page and optionally fetch artifacts.
  # Payload aligned with Akasha_app Update Release Notes workflow (version, release_date, title, description, download_url, changelog, tag, release_url, repository).
  # Requires secret AKASHA_APP_DISPATCH_TOKEN: PAT or fine-grained token with Actions read/write on azerothl/Akasha_app.
  deploy_site:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Akasha_app deployment via repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          REPO_OWNER: azerothl
          REPO_APP: Akasha_app
          TOKEN: ${{ secrets.AKASHA_APP_DISPATCH_TOKEN }}
          AKASHA_REPO: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "AKASHA_APP_DISPATCH_TOKEN not set, skipping deployment."
            exit 0
          fi
          RELEASE_BODY=$(gh release view "$VERSION" --json body -q .body)
          DESCRIPTION="${RELEASE_BODY:-Release $VERSION}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          # release_type: major for x.0.0, minor for x.y.0, patch otherwise
          case "$VERSION" in
            v*.0.0) RELEASE_TYPE="major" ;;
            v*.*.0) RELEASE_TYPE="minor" ;;
            *)      RELEASE_TYPE="patch" ;;
          esac
          RELEASE_URL="https://github.com/${AKASHA_REPO}/releases/tag/${VERSION}"
          TITLE="$VERSION"
          DOWNLOAD_URL="$RELEASE_URL"
          # Build JSON payload (changelog empty; Akasha_app can enrich from release notes if needed)
          PAYLOAD=$(jq -n \
            --arg event_type "new_release" \
            --arg version "$VERSION" \
            --arg tag "$VERSION" \
            --arg release_url "$RELEASE_URL" \
            --arg repository "$AKASHA_REPO" \
            --arg release_date "$RELEASE_DATE" \
            --arg release_type "$RELEASE_TYPE" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg download_url "$DOWNLOAD_URL" \
            '{event_type: $event_type, client_payload: {
              version: $version, tag: $tag, release_url: $release_url, repository: $repository,
              release_date: $release_date, release_type: $release_type, title: $title,
              description: $description, download_url: $download_url, changelog: []
            }}')
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO_OWNER}/${REPO_APP}/dispatches" \
            -d "$PAYLOAD"
