# Build release binaries for Akasha (CLI + daemon + TUI) and publish to GitHub Releases.
# Trigger: push a tag like v0.1.0 or v1.0.0 (e.g. git tag v0.1.0 && git push origin v0.1.0),
# or run manually from the Actions tab (workflow_dispatch) with a version input.
# Users can then download the zip for their OS from the Releases page (no compilation needed).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0). Used when running manually; must match an existing tag or the release will be created from the current branch.'
        required: true
        type: string
      publish:
        description: Publish the release and notify the site (false = build/measure only)
        required: true
        type: boolean
        default: true

jobs:
  verify-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify embedded version matches git tag
        run: |
          set -e
          REF="${{ github.ref }}"
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "Not a tag ref ($REF); skipping version check (e.g. workflow_dispatch)."
            exit 0
          fi
          TAG_VER="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(python3 -c "
          import re
          from pathlib import Path
          t = Path('Cargo.toml').read_text(encoding='utf-8')
          m = re.search(r'\[workspace\.package\]\s*\nversion = \"([^\"]+)\"', t)
          print(m.group(1) if m else '')
          ")
          PKG_VER=$(jq -r .version apps/akasha-ui/package.json)
          TAURI_VER=$(jq -r .version apps/akasha-ui/src-tauri/tauri.conf.json)
          if [[ -z "$CARGO_VER" ]]; then
            echo "::error::Could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [[ "$TAG_VER" != "$CARGO_VER" ]]; then
            echo "::error::Tag v$TAG_VER does not match Cargo.toml workspace.package version ($CARGO_VER). Run workflow 'Sync release version' first, then tag."
            exit 1
          fi
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "::error::Tag v$TAG_VER does not match apps/akasha-ui/package.json ($PKG_VER)."
            exit 1
          fi
          if [[ "$TAG_VER" != "$TAURI_VER" ]]; then
            echo "::error::Tag v$TAG_VER does not match apps/akasha-ui/src-tauri/tauri.conf.json ($TAURI_VER)."
            exit 1
          fi
          echo "OK: tag v$TAG_VER matches Cargo workspace, package.json, and tauri.conf.json"

  # Non-Windows builds remain parallel with Windows clients and daemon jobs.
  build:
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: akasha-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: akasha-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: akasha-macos-aarch64
    uses: ./.github/workflows/build-release.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      artifact_name: ${{ matrix.artifact_name }}

  windows-clients:
    needs: verify-release-version
    # VS 2022 client binaries support both the CPU and CUDA Windows archives.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start measurement
        run: python scripts/ci/report_build.py start
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo dependencies
        id: cache
        uses: ./.github/actions/cargo-cache
        with:
          variant: release-windows-2022-x86_64-msvc-clients
      - name: Build Windows CLI and TUI once
        run: cargo build --locked --timings --release --target x86_64-pc-windows-msvc -p akasha-cli -p akasha-tui
      - name: Record hashes and dependency features
        run: python scripts/ci/windows_clients.py
      - name: Smoke CLI
        run: ./target/x86_64-pc-windows-msvc/release/akasha.exe --version
      - name: Share Windows clients
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: windows-clients
          path: |
            target/x86_64-pc-windows-msvc/release/akasha.exe
            target/x86_64-pc-windows-msvc/release/akasha-tui.exe
            target/x86_64-pc-windows-msvc/release/windows-clients.json
          if-no-files-found: error
          retention-days: 1
      - name: Report build/cache
        if: always()
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: python scripts/ci/report_build.py finish --cache-hit '${{ steps.cache.outputs.cache-hit }}'
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: metrics-windows-clients
          path: |
            ci-build-report.json
            windows-clients-dependencies.txt
            target/cargo-timings/
          retention-days: 14

  build-windows:
    needs: [verify-release-version, windows-clients]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: akasha-windows-x86_64
            cuda: false
            daemon_features: embedded,embeddings-tract,embedded-baguettotron
          # CUDA 12.9 requires VS 2022, not windows-latest/VS 2026.
          - os: windows-2022
            artifact_name: akasha-windows-x86_64-cuda
            cuda: true
            daemon_features: embedded,embeddings-tract,embedded-baguettotron,embedded-llama-cpp,embedded-llama-cpp-cuda
    uses: ./.github/workflows/build-release.yml
    with:
      os: ${{ matrix.os }}
      target: x86_64-pc-windows-msvc
      artifact_name: ${{ matrix.artifact_name }}
      ext: .exe
      cuda: ${{ matrix.cuda }}
      daemon_features: ${{ matrix.daemon_features }}
      clients_artifact: windows-clients

  build-tauri:
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: akasha-ui-linux
          - os: macos-15-intel
            artifact_name: akasha-ui-macos-x86_64
          - os: macos-latest
            artifact_name: akasha-ui-macos-aarch64
          - os: windows-latest
            artifact_name: akasha-ui-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start measurement
        run: python scripts/ci/report_build.py start

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: apps/akasha-ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies (Tauri)
        id: cache
        uses: ./.github/actions/cargo-cache
        with:
          variant: release-tauri-${{ matrix.os }}
          workspaces: apps/akasha-ui/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        working-directory: apps/akasha-ui
        run: npm ci

      - name: Ensure Tauri icon exists
        run: |
          node scripts/gen-ico.js

      - name: Build Tauri app
        working-directory: apps/akasha-ui
        run: npx tauri build -- --locked --timings

      - name: Report build/cache
        if: always()
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: python scripts/ci/report_build.py finish --cache-hit '${{ steps.cache.outputs.cache-hit }}' --target-dir apps/akasha-ui/src-tauri/target
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: metrics-${{ matrix.artifact_name }}
          path: ci-build-report.json
          retention-days: 14

      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ matrix.artifact_name }}
          path: apps/akasha-ui/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7

  package:
    if: ${{ always() && needs.verify-release-version.result == 'success' && needs.build.result == 'success' && needs.build-windows.result == 'success' && needs.build-tauri.result == 'success' }}
    needs: [verify-release-version, build, build-windows, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: akasha-*
          path: artifacts

      - name: Create release archives
        run: |
          set -e
          RELEASE_DIR="$(pwd)/release"
          mkdir -p "$RELEASE_DIR"

          # download-artifact@v4 may place artifacts in artifacts/ or artifacts/artifact/ (see actions/download-artifact#356)
          ARTIFACTS_ROOT=artifacts
          if [ -d "artifacts/artifact" ] && [ -n "$(ls -A artifacts/artifact 2>/dev/null)" ]; then
            ARTIFACTS_ROOT=artifacts/artifact
          fi
          echo "Using artifacts root: $ARTIFACTS_ROOT"
          ls -la "$ARTIFACTS_ROOT" || true
          ARTIFACT_COUNT=$(find "$ARTIFACTS_ROOT" -maxdepth 1 -type d -name 'akasha-*' 2>/dev/null | wc -l)
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No artifact directories (akasha-*) found under $ARTIFACTS_ROOT. Ensure build and build-tauri jobs completed and uploaded artifacts."
            exit 1
          fi

          for dir in "$ARTIFACTS_ROOT"/akasha-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$RELEASE_DIR/${name}.zip" .)
          done

          for dir in "$ARTIFACTS_ROOT"/akasha-ui-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            # actions/upload-artifact stores files without their Unix mode bits.
            # Restore the Tauri launchers before creating the standalone UI zip.
            case "$name" in
              akasha-ui-linux)
                appdir="$dir/appimage/Akasha.AppDir"
                appimage=$(find "$dir/appimage" -maxdepth 1 -type f -iname '*.AppImage' -print -quit)
                if [ -z "$appimage" ]; then
                  echo "::error::Required Linux AppImage is missing from $dir/appimage"
                  exit 1
                fi
                for path in "$appimage" "$appdir/AppRun" "$appdir/AppRun.wrapped" "$appdir/usr/bin/akasha-ui"; do
                  if [ ! -f "$path" ]; then
                    echo "::error::Required Linux UI file is missing: $path"
                    exit 1
                  fi
                  chmod +x "$path"
                done
                # The artifact service also strips execute bits from WebKit's child processes.
                mapfile -d '' webkit_processes < <(find "$appdir" -type f -name 'WebKit*Process' -print0)
                if [ "${#webkit_processes[@]}" -eq 0 ]; then
                  echo "::error::No WebKit subprocesses found under $appdir"
                  exit 1
                fi
                chmod +x "${webkit_processes[@]}"
                ;;
              akasha-ui-macos-*)
                binary="$dir/macos/Akasha.app/Contents/MacOS/akasha-ui"
                if [ ! -f "$binary" ]; then
                  echo "::error::Required macOS UI executable is missing: $binary"
                  find "$dir" -maxdepth 5 -print || true
                  exit 1
                fi
                chmod +x "$binary"
                ;;
            esac
            (cd "$dir" && zip -r "$RELEASE_DIR/${name}.zip" .)
          done

          # Full installer zips: CLI + setup scripts + UI bundle per OS
          for cli_dir in "$ARTIFACTS_ROOT"/akasha-windows-x86_64 "$ARTIFACTS_ROOT"/akasha-linux-x86_64 "$ARTIFACTS_ROOT"/akasha-macos-x86_64 "$ARTIFACTS_ROOT"/akasha-macos-aarch64; do
            [ -d "$cli_dir" ] || continue
            base=$(basename "$cli_dir")
            suffix=${base#akasha-}
            ui_name=akasha-ui-linux
            case "$suffix" in
              windows-x86_64) ui_name=akasha-ui-windows ;;
              linux-x86_64)   ui_name=akasha-ui-linux ;;
              macos-x86_64)   ui_name=akasha-ui-macos-x86_64 ;;
              macos-aarch64)  ui_name=akasha-ui-macos-aarch64 ;;
            esac
            full_name="akasha-full-${suffix}"
            mkdir -p "$RELEASE_DIR/${full_name}"
            cp -r "$cli_dir"/* "$RELEASE_DIR/${full_name}/"
            if [ ! -d "$ARTIFACTS_ROOT/${ui_name}" ]; then
              echo "::error::Required UI artifact is missing: $ARTIFACTS_ROOT/${ui_name}"
              exit 1
            fi
            mkdir -p "$RELEASE_DIR/${full_name}/ui"
            cp -r "$ARTIFACTS_ROOT/${ui_name}"/* "$RELEASE_DIR/${full_name}/ui/"
            # Restore entry-point modes after download-artifact strips them.
            case "$suffix" in
              linux-x86_64)
                appdir="$RELEASE_DIR/${full_name}/ui/appimage/Akasha.AppDir"
                appimage=$(find "$RELEASE_DIR/${full_name}/ui/appimage" -maxdepth 1 -type f -iname '*.AppImage' -print -quit)
                if [ -z "$appimage" ]; then
                  echo "::error::Required Linux AppImage is missing from ${full_name}/ui/appimage"
                  exit 1
                fi
                for path in "$appimage" "$appdir/AppRun" "$appdir/AppRun.wrapped" "$appdir/usr/bin/akasha-ui"; do
                  if [ ! -f "$path" ]; then
                    echo "::error::Required Linux UI file is missing from ${full_name}: $path"
                    exit 1
                  fi
                  chmod +x "$path"
                done
                # The artifact service also strips execute bits from WebKit's child processes.
                mapfile -d '' webkit_processes < <(find "$appdir" -type f -name 'WebKit*Process' -print0)
                if [ "${#webkit_processes[@]}" -eq 0 ]; then
                  echo "::error::No WebKit subprocesses found under $appdir"
                  exit 1
                fi
                chmod +x "${webkit_processes[@]}"
                ;;
              macos-x86_64|macos-aarch64)
                binary="$RELEASE_DIR/${full_name}/ui/macos/Akasha.app/Contents/MacOS/akasha-ui"
                if [ ! -f "$binary" ]; then
                  echo "::error::Required macOS UI executable is missing from ${full_name}: $binary"
                  find "$RELEASE_DIR/${full_name}/ui" -maxdepth 6 -print || true
                  exit 1
                fi
                chmod +x "$binary"
                ;;
            esac
            # README at root of full zip (all platforms)
            printf 'To install: Windows: double-click INSTALL.cmd. Linux/macOS: in a terminal, run: chmod +x scripts/setup.sh && ./scripts/setup.sh\n' > "$RELEASE_DIR/${full_name}/README.txt"
            # Windows full zip: entry point that bypasses ExecutionPolicy for setup.ps1
            if [ "$suffix" = "windows-x86_64" ]; then
              printf '%s\r\n' '@echo off' 'powershell -ExecutionPolicy Bypass -File "%~dp0scripts\setup.ps1"' 'pause' > "$RELEASE_DIR/${full_name}/INSTALL.cmd"
            fi
            (cd "$RELEASE_DIR/${full_name}" && zip -r "$RELEASE_DIR/${full_name}.zip" .)
            rm -rf "$RELEASE_DIR/${full_name}"
          done

          # Full CUDA Windows zip: CUDA CLI + UI + scripts (mirror full CPU)
          CUDA_CLI="$ARTIFACTS_ROOT/akasha-windows-x86_64-cuda"
          UI_WIN="$ARTIFACTS_ROOT/akasha-ui-windows"
          if [ -d "$CUDA_CLI" ]; then
            full_cuda="akasha-full-windows-x86_64-cuda"
            mkdir -p "$RELEASE_DIR/${full_cuda}"
            cp -r "$CUDA_CLI"/* "$RELEASE_DIR/${full_cuda}/"
            if [ -d "$UI_WIN" ]; then
              mkdir -p "$RELEASE_DIR/${full_cuda}/ui"
              cp -r "$UI_WIN"/* "$RELEASE_DIR/${full_cuda}/ui/"
            fi
            printf 'To install: double-click INSTALL.cmd or run: powershell -ExecutionPolicy Bypass -File scripts\\setup.ps1\r\n' > "$RELEASE_DIR/${full_cuda}/README.txt"
            printf '%s\r\n' '@echo off' 'powershell -ExecutionPolicy Bypass -File "%~dp0scripts\setup.ps1"' 'pause' > "$RELEASE_DIR/${full_cuda}/INSTALL.cmd"
            (cd "$RELEASE_DIR/${full_cuda}" && zip -r "$RELEASE_DIR/${full_cuda}.zip" .)
            rm -rf "$RELEASE_DIR/${full_cuda}"
          fi

          echo "Contents of release/ after zipping:"
          ls -la "$RELEASE_DIR/" || true

          shopt -s nullglob
          RELEASE_FILES=("$RELEASE_DIR"/*.zip)
          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "::error::No zip files produced in release/. Check that build and build-tauri jobs uploaded artifacts and that artifact paths match (see ARTIFACTS_ROOT=$ARTIFACTS_ROOT)."
            exit 1
          fi

      - name: Verify shared Windows clients in packaged archives
        run: python scripts/ci/verify_release_windows_archives.py release

      - name: Upload release archives for verification
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: release/*.zip
          if-no-files-found: error
          retention-days: 7

  validate-release-archives:
    needs: [verify-release-version, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: akasha-full-linux-x86_64.zip
          - os: macos-15-intel
            artifact: akasha-full-macos-x86_64.zip
          - os: macos-latest
            artifact: akasha-full-macos-aarch64.zip
          - os: windows-latest
            artifact: akasha-full-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download packaged release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release

      - name: Install Linux desktop smoke dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xdotool x11-utils openbox

      - name: Validate Linux / macOS archive first boot and response
        if: runner.os != 'Windows'
        env:
          ARTIFACT_ZIP: release/${{ matrix.artifact }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          INFERENCE_TIMEOUT_SECS: "360"
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/release-first-boot
        run: bash scripts/smoke-release-artifact-linux.sh

      - name: Validate Windows archive first boot and response
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/smoke-release-artifact-windows.ps1
          -ArtifactZip "release\${{ matrix.artifact }}"
          -ExpectedVersion "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          -InferenceTimeoutSecs 360
          -EvidenceDir "${{ runner.temp }}\release-first-boot"

      - name: Preserve first-boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-boot-${{ matrix.artifact }}
          path: ${{ runner.temp }}/release-first-boot
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs: [package, validate-release-archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          set -e
          shopt -s nullglob
          RELEASE_FILES=("release"/*.zip)
          if [ ${#RELEASE_FILES[@]} -eq 0 ]; then
            echo "::error::No packaged release archives were downloaded."
            exit 1
          fi

          # Align tags with origin. Plain `git fetch --tags` fails with
          # "would clobber existing tag" when checkout left a lightweight tag
          # and origin has an annotated tag (or the tag moved) for the same name.
          git fetch --tags --force
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists locally/remote."
          else
            echo "::error::Tag $VERSION does not exist. Create the tag first (e.g. git tag $VERSION && git push origin $VERSION), or use a new version."
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Use a new version (e.g. v0.4.1) or delete the release and tag on GitHub first. Avoid force-pushing tags (would clobber existing tag)."
            exit 1
          fi

          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          NOTES_OPT="--generate-notes"
          [ -n "$PREV_TAG" ] && NOTES_OPT="$NOTES_OPT --notes-start-tag $PREV_TAG"

          gh release create "$VERSION" \
            --title "$VERSION" \
            $NOTES_OPT \
            "${RELEASE_FILES[@]}"

  # Notify the site repo (azerothl/Akasha_app) so it can update releases page and optionally fetch artifacts.
  # Payload aligned with Akasha_app Update Release Notes workflow (version, release_date, title, description, download_url, changelog, tag, release_url, repository).
  # Requires secret AKASHA_APP_DISPATCH_TOKEN: PAT or fine-grained token with Actions read/write on azerothl/Akasha_app.
  deploy_site:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Akasha_app deployment via repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          REPO_OWNER: azerothl
          REPO_APP: Akasha_app
          TOKEN: ${{ secrets.AKASHA_APP_DISPATCH_TOKEN }}
          AKASHA_REPO: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "AKASHA_APP_DISPATCH_TOKEN not set, skipping deployment."
            exit 0
          fi
          RELEASE_BODY=$(gh release view "$VERSION" --json body -q .body)
          DESCRIPTION="${RELEASE_BODY:-Release $VERSION}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          # release_type: major for x.0.0, minor for x.y.0, patch otherwise
          case "$VERSION" in
            v*.0.0) RELEASE_TYPE="major" ;;
            v*.*.0) RELEASE_TYPE="minor" ;;
            *)      RELEASE_TYPE="patch" ;;
          esac
          RELEASE_URL="https://github.com/${AKASHA_REPO}/releases/tag/${VERSION}"
          TITLE="$VERSION"
          DOWNLOAD_URL="$RELEASE_URL"
          # Build JSON payload (changelog empty; Akasha_app can enrich from release notes if needed)
          PAYLOAD=$(jq -n \
            --arg event_type "new_release" \
            --arg version "$VERSION" \
            --arg tag "$VERSION" \
            --arg release_url "$RELEASE_URL" \
            --arg repository "$AKASHA_REPO" \
            --arg release_date "$RELEASE_DATE" \
            --arg release_type "$RELEASE_TYPE" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg download_url "$DOWNLOAD_URL" \
            '{event_type: $event_type, client_payload: {
              version: $version, tag: $tag, release_url: $release_url, repository: $repository,
              release_date: $release_date, release_type: $release_type, title: $title,
              description: $description, download_url: $download_url, changelog: []
            }}')
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO_OWNER}/${REPO_APP}/dispatches" \
            -d "$PAYLOAD"
