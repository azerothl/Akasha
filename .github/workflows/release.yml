# Build release binaries for Akasha (CLI + daemon + TUI) and publish to GitHub Releases.
# Trigger: push a tag like v0.1.0 or v1.0.0 (e.g. git tag v0.1.0 && git push origin v0.1.0).
# Users can then download the zip for their OS from the Releases page (no compilation needed).

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: akasha-linux-x86_64
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: akasha-macos-x86_64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: akasha-macos-aarch64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: akasha-windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build CLI and TUI
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-cli -p akasha-tui

      - name: Build daemon (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-daemon

      - name: Build daemon (Windows, without embeddings and baguettotron to avoid linker errors)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-daemon --no-default-features --features embedded,embeddings-tract,embedded-baguettotron

      - name: Prepare artifact (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging/docs
          cp target/${{ matrix.target }}/release/akasha${{ matrix.ext }} staging/
          cp target/${{ matrix.target }}/release/akasha-daemon${{ matrix.ext }} staging/
          cp target/${{ matrix.target }}/release/akasha-tui${{ matrix.ext }} staging/
          cp docs/user_guide_final.md staging/docs/user_guide.md
          chmod +x staging/*

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir staging
          mkdir staging\docs
          cp target/${{ matrix.target }}/release/akasha.exe staging/
          cp target/${{ matrix.target }}/release/akasha-daemon.exe staging/
          cp target/${{ matrix.target }}/release/akasha-tui.exe staging/
          cp docs/user_guide_final.md staging/docs/user_guide.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p release

          for dir in artifacts/akasha-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Précompilés Akasha (CLI + daemon + TUI) + doc (docs/user_guide.md). Décompressez l’archive pour votre OS puis lancez \`akasha init\` puis \`akasha start\`. Voir spec/distribution.md." \
            release/*.zip

  # Notify the site repo (azerothl/Akasha_app) so it can update releases page and deploy.
  # Requires secret AKASHA_APP_DISPATCH_TOKEN: PAT or fine-grained token with repo + workflow scope for azerothl/Akasha_app.
  deploy_site:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ secrets.AKASHA_APP_DISPATCH_TOKEN != '' }}
    steps:
      - name: Trigger Akasha_app deployment via repository_dispatch
        env:
          VERSION: ${{ github.ref_name }}
          REPO_OWNER: azerothl
          REPO_APP: Akasha_app
          TOKEN: ${{ secrets.AKASHA_APP_DISPATCH_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO_OWNER}/${REPO_APP}/dispatches" \
            -d "{\"event_type\":\"akasha-release\",\"client_payload\":{\"version\":\"${VERSION}\",\"tag\":\"${VERSION}\",\"release_url\":\"https://github.com/${{ github.repository }}/releases/tag/${VERSION}\",\"repository\":\"${{ github.repository }}\"}}"
