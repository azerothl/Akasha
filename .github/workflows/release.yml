# Build release binaries for Akasha (CLI + daemon + TUI) and publish to GitHub Releases.
# Trigger: push a tag like v0.1.0 or v1.0.0 (e.g. git tag v0.1.0 && git push origin v0.1.0).
# Users can then download the zip for their OS from the Releases page (no compilation needed).

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: akasha-linux-x86_64
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: akasha-macos-x86_64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: akasha-macos-aarch64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: akasha-windows-x86_64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build CLI and TUI
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-cli -p akasha-tui

      - name: Build daemon (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-daemon

      - name: Build daemon (Windows, without embeddings to avoid ONNX linker errors)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --release --target ${{ matrix.target }} -p akasha-daemon --no-default-features

      - name: Prepare artifact (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/akasha${{ matrix.ext }} staging/
          cp target/${{ matrix.target }}/release/akasha-daemon${{ matrix.ext }} staging/
          cp target/${{ matrix.target }}/release/akasha-tui${{ matrix.ext }} staging/
          chmod +x staging/*

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/akasha.exe staging/
          cp target/${{ matrix.target }}/release/akasha-daemon.exe staging/
          cp target/${{ matrix.target }}/release/akasha-tui.exe staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p release

          for dir in artifacts/akasha-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Précompilés Akasha (CLI + daemon + TUI). Décompressez l’archive pour votre OS puis lancez \`akasha init\` puis \`akasha start\`. Voir spec/distribution.md." \
            release/*.zip
