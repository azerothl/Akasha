# GPU smoke + embedded bench on self-hosted runner (NVIDIA).
# Requires a machine with labels: self-hosted, gpu, nvidia
# See spec/dev/quality/GPU_SELF_HOSTED_CI.md

name: GPU CI

on:
  push:
    branches: [main, "0.*"]
    paths:
      - "crates/akasha-embedded-llm/**"
      - "crates/akasha-daemon/**"
      - "crates/akasha-llm/**"
      - ".github/workflows/gpu-ci.yml"
      - ".github/workflows/release.yml"
      - "scripts/install.ps1"
      - "scripts/build-windows-daemon-cuda.ps1"
      - "spec/dev/quality/bench_embedded*.ps1"
  pull_request:
    paths:
      - "crates/akasha-embedded-llm/**"
      - "crates/akasha-daemon/**"
      - "crates/akasha-llm/**"
      - ".github/workflows/gpu-ci.yml"
      - ".github/workflows/release.yml"
      - "scripts/install.ps1"
      - "scripts/build-windows-daemon-cuda.ps1"
      - "spec/dev/quality/bench_embedded*.ps1"
  workflow_dispatch:

jobs:
  gpu-smoke:
    runs-on: [self-hosted, gpu, nvidia]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CUDA daemon
        shell: pwsh
        run: |
          $Target = "x86_64-pc-windows-msvc"
          $env:CUDA_PATH = $env:CUDA_PATH ?? "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          if (-not $env:LIBCLANG_PATH) {
            $llvmBin = "C:\Program Files\LLVM\bin"
            if (Test-Path (Join-Path $llvmBin "libclang.dll")) {
              $env:LIBCLANG_PATH = $llvmBin
            }
          }
          # CLI only (CPU); daemon must stay CUDA — do not rebuild akasha-daemon with default features.
          cargo build --release --target $Target -p akasha-cli
          .\scripts\build-windows-daemon-cuda.ps1 -Target $Target

      - name: Prepare data dir and GGUF
        shell: pwsh
        env:
          AKASHA_DATA_DIR: ${{ runner.temp }}\akasha-gpu-ci
        run: |
          $ReleaseDir = "target\x86_64-pc-windows-msvc\release"
          New-Item -ItemType Directory -Force -Path $env:AKASHA_DATA_DIR | Out-Null
          & "$ReleaseDir\akasha.exe" init --defaults
          & "$ReleaseDir\akasha.exe" config models embedded-download

      - name: Smoke HTTP CUDA daemon
        shell: pwsh
        env:
          AKASHA_DATA_DIR: ${{ runner.temp }}\akasha-gpu-ci
        run: |
          $ReleaseDir = "target\x86_64-pc-windows-msvc\release"
          $daemon = Start-Process -FilePath "$ReleaseDir\akasha-daemon.exe" -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                Invoke-RestMethod -Uri "http://127.0.0.1:3876/api/status" -TimeoutSec 2 | Out-Null
                $ok = $true
                break
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ok) { throw "daemon did not become ready" }
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:3876/api/status"
            if ($status.status -ne "ok") { throw "unexpected status: $($status | ConvertTo-Json -Compress)" }
          } finally {
            if ($daemon -and -not $daemon.HasExited) { Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Bench embedded (strict JSON)
        shell: pwsh
        env:
          AKASHA_DATA_DIR: ${{ runner.temp }}\akasha-gpu-ci
        run: |
          pwsh ./spec/dev/quality/bench_embedded.ps1 -Backend llama_cpp -Strict -Json

      - name: Bench embedded models matrix
        shell: pwsh
        env:
          AKASHA_DATA_DIR: ${{ runner.temp }}\akasha-gpu-ci
        run: |
          pwsh ./spec/dev/quality/bench_embedded_models.ps1 -Matrix -SimulatedTier gpu_low_4gb -NglValues 0,99
