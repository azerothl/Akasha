# Bump product version in repo (workspace + akasha-ui) in one commit.
# Run this BEFORE creating the release tag, then: git pull, git tag vX.Y.Z, git push origin vX.Y.Z
#
# After this sync (and before the tag): regenerate spec/dev/architecture/
# (architecture-diagram.html + architecture-graph.json) so the map matches the release.
# See spec/dev/architecture/README.md and AGENTS.md § Release version alignment.
#
# If `main` is branch-protected, add repository secret VERSION_SYNC_TOKEN (PAT with contents:write).

name: Sync release version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v prefix (e.g. 0.8.0)"
        required: true
        type: string
      branch:
        description: "Branch to commit to"
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # Use VERSION_SYNC_TOKEN if the target branch is protected (PAT with contents:write).
          token: ${{ secrets.VERSION_SYNC_TOKEN != '' && secrets.VERSION_SYNC_TOKEN || github.token }}

      - name: Sync version files
        run: python3 scripts/sync-release-version.py "${{ inputs.version }}"

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml apps/akasha-ui/package.json apps/akasha-ui/package-lock.json \
            apps/akasha-ui/src-tauri/Cargo.toml apps/akasha-ui/src-tauri/tauri.conf.json
          if git diff --staged --quiet; then
            echo "No changes (version already $VERSION)."
            exit 0
          fi
          git commit -m "chore: sync release version to $VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
