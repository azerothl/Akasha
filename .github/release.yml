# Configures automatically generated release notes (used by gh release create --generate-notes
# and the "Generate release notes" button on GitHub). See:
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes#configuring-automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - Semver-Major
    - title: Features
      labels:
        - enhancement
        - feature
        - Semver-Minor
    - title: Fixes
      labels:
        - bug
        - fix
        - Semver-Patch
    - title: Dependencies
      labels:
        - dependencies
    - title: Other
      labels:
        - "*"
