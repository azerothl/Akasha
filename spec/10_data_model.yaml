entities:
  user:
    id: uuid
    preferences: encrypted_object
    created_at: datetime

  task:
    id: uuid
    parent_task_id: uuid | null
    status: pending | running | completed | failed
    assigned_agent: string
    created_at: datetime
    updated_at: datetime

  memory_entry:
    id: uuid
    type: short_term | long_term
    encrypted: boolean
    vector_indexed: boolean
    created_at: datetime