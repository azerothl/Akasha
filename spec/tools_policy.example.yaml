# Politique des outils machine (Phase A). Utilisé par le daemon : data_dir/tools_policy.yaml
# Fichier absent ou vide = tout refusé. Pour autoriser lecture/écriture de fichiers, ajoutez
# des préfixes de chemins (répertoires ou fichiers) sous allowed_read_paths / allowed_write_paths.
# L'agent peut alors utiliser read_file / write_file pour les chemins sous ces préfixes.
#
# Projets longs (roman, BD, projet de code) : pour isoler le projet du reste du système, créez
# un répertoire dédié par projet et listez-le SEUL ici. N'utilisez pas "." ou un répertoire parent
# large si vous voulez limiter l'accès aux fichiers du projet. Voir spec/projects_long_running.md.

allowed_read_paths:
  - "."                    # répertoire de travail du daemon (ex. répertoire du projet)
  # - "C:\\Users\\Vous\\projet"   # Windows : décommenter et adapter
  # - "/home/user/projet"          # Linux/macOS : décommenter et adapter
  # - "C:\\Users\\Vous\\akasha_projects\\mon_roman"   # Exemple : projet long dédié (roman, BD, code)

allowed_write_paths:
  - "."                    # idem : autoriser l'écriture dans le répertoire courant
  # - "C:\\Users\\VOTRE_UTILISATEUR\\AppData\\Local\\akasha"   # Windows : ex. pour enregistrer des jeux/code dans akasha\games
  # Ajoutez ici les répertoires où l'agent peut écrire des fichiers (génération de code, etc.)
  # Pour un projet long isolé : un seul répertoire dédié (ex. ~/akasha_projects/mon_roman)

allowed_commands:
  - "cargo"
  - "npm"
  - "node"
  - "git"
  # - "cmd"   # Windows : à utiliser avec précaution
# Pour tout autoriser : allowed_commands: ["*"]  (sous réserve de blocked_commands)

# Optionnel : commandes interdites pour run_command (prioritaire sur allowed_commands)
# blocked_commands: []
# Exemple (avec allowed_commands: ["*"]) : blocked_commands: ["format", "rm", "del"]

command_timeout_secs: 60

# Optionnel : domaines autorisés pour web_fetch (nécessite la feature "web")
# allowed_web_domains: []
# Pour tout autoriser : allowed_web_domains: ["*"]  (sous réserve de blocked_web_domains)

# Optionnel : domaines interdits pour web_fetch (prioritaire sur allowed_web_domains)
# blocked_web_domains: []
# Exemple : blocked_web_domains: ["evil.com", "tracker.example.org"]

# Optionnel : activer la recherche web (Brave API). Si true + BRAVE_API_KEY (ou vault brave_api_key),
# l'agent utilisera web_search pour chercher lui-même météo, actualités, etc. au lieu de suggérer des sites.
# web_search_enabled: false

# Optionnel : crawl de site entier via Cloudflare Browser Rendering (/crawl).
# Si activé, l'agent peut utiliser web_crawl et web_crawl_status. Nécessite un compte Cloudflare.
# web_crawl_enabled: false
# cloudflare_account_id: ""   # ex. identifiant du compte Cloudflare
# Clé API : vault cloudflare_api_token ou variable d'environnement CLOUDFLARE_API_TOKEN

# Optionnel : profils d'outils (default_profile = nom du profil ; tool_profiles[profil] = liste d'outils)
# default_profile: null
# tool_profiles: {}
# Exemple : default_profile: "coding"
#          tool_profiles: { coding: [read_file, write_file, search_files, grep_content, run_command, edit_file, apply_patch] }

# Optionnel : hôtes autorisés pour install_skill (site web, GitLab, etc.). Par défaut : GitHub uniquement.
# allowed_skill_install_hosts: []
# Exemple (GitHub + GitLab + votre domaine) : allowed_skill_install_hosts: ["github.com", "raw.githubusercontent.com", "gitlab.com", "mon-entreprise.com"]
# Pour autoriser toute URL HTTPS : allowed_skill_install_hosts: ["*"]

# Optionnel : interfaces appareil autorisées pour device_discover / device_invoke (caméra, micro, imprimantes, etc.).
# Utiliser ["*"] pour autoriser toutes les interfaces (sous réserve de blocked_device_interfaces).
# allowed_device_interfaces: []
# Exemple : tout autoriser sauf USB
# allowed_device_interfaces: ["*"]
# blocked_device_interfaces: [usb]
# Exemple : uniquement média local et imprimantes
# allowed_device_interfaces: [local_media, system]
# blocked_device_interfaces: []
# Exemple : média local + entrées synthétiques (clavier/souris pour raccourcis, jeux, dessin)
# allowed_device_interfaces: [local_media, synthetic_input]
# synthetic_input permet à l'agent d'envoyer raccourcis clavier (ex. screenshot), clics/déplacements souris (jeux, logiciels de dessin). Recommandé : require_approval avec device_invoke.

# Optionnel : interfaces appareil interdites (prioritaire sur allowed_device_interfaces).
# blocked_device_interfaces: []

# Optionnel : automation navigateur (spec 39). Une instance Playwright par tâche (navigate, snapshot).
# Nécessite : npx playwright install chromium dans scripts/playwright-runner (ou AKASHA_PLAYWRIGHT_RUNNER).
# browser_enabled: false
# browser_allowed_domains: []   # ex. ["*"] pour tout, ou ["example.com", "docs.example.com"]
# browser_blocked_domains: []
# browser_headless: true
# browser_action_timeout_secs: 30
# browser_session_timeout_secs: 300
# Désactiver l'installation auto de Chromium au premier appel browser : variable d'environnement AKASHA_PLAYWRIGHT_AUTO_INSTALL=0

# Optionnel : outils pour lesquels une confirmation utilisateur est requise avant exécution (human-in-the-loop).
# Quand un outil est dans cette liste, le daemon affiche un résumé d'intention (ex. « Écrire dans le fichier X », « Exécuter la commande Y »)
# et n'exécute qu'après approbation explicite (bouton Approuver / Refuser dans l'UI).
# Pour demander confirmation avant d'ouvrir une URL dans le navigateur : ajouter browser à la liste.
# require_approval: [write_file, run_command, run_in_container, apply_patch, edit_file, device_invoke]
