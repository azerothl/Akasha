# Politique des outils machine (Phase A). Utilisé par le daemon : data_dir/tools_policy.yaml
# Fichier absent ou vide = tout refusé. Pour autoriser lecture/écriture de fichiers, ajoutez
# des préfixes de chemins (répertoires ou fichiers) sous allowed_read_paths / allowed_write_paths.
# L'agent peut alors utiliser read_file / write_file pour les chemins sous ces préfixes.

allowed_read_paths:
  - "."                    # répertoire de travail du daemon (ex. répertoire du projet)
  # - "C:\\Users\\Vous\\projet"   # Windows : décommenter et adapter
  # - "/home/user/projet"          # Linux/macOS : décommenter et adapter

allowed_write_paths:
  - "."                    # idem : autoriser l'écriture dans le répertoire courant
  # - "C:\\Users\\VOTRE_UTILISATEUR\\AppData\\Local\\akasha"   # Windows : ex. pour enregistrer des jeux/code dans akasha\games
  # Ajoutez ici les répertoires où l'agent peut écrire des fichiers (génération de code, etc.)

allowed_commands:
  - "cargo"
  - "npm"
  - "node"
  - "git"
  # - "cmd"   # Windows : à utiliser avec précaution
# Pour tout autoriser : allowed_commands: ["*"]  (sous réserve de blocked_commands)

# Optionnel : commandes interdites pour run_command (prioritaire sur allowed_commands)
# blocked_commands: []
# Exemple (avec allowed_commands: ["*"]) : blocked_commands: ["format", "rm", "del"]

command_timeout_secs: 60

# Optionnel : domaines autorisés pour web_fetch (nécessite la feature "web")
# allowed_web_domains: []
# Pour tout autoriser : allowed_web_domains: ["*"]  (sous réserve de blocked_web_domains)

# Optionnel : domaines interdits pour web_fetch (prioritaire sur allowed_web_domains)
# blocked_web_domains: []
# Exemple : blocked_web_domains: ["evil.com", "tracker.example.org"]

# Optionnel : activer la recherche web (Brave API). Si true + BRAVE_API_KEY (ou vault brave_api_key),
# l'agent utilisera web_search pour chercher lui-même météo, actualités, etc. au lieu de suggérer des sites.
# web_search_enabled: false

# Optionnel : profils d'outils (default_profile = nom du profil ; tool_profiles[profil] = liste d'outils)
# default_profile: null
# tool_profiles: {}
# Exemple : default_profile: "coding"
#          tool_profiles: { coding: [read_file, write_file, search_files, grep_content, run_command, edit_file, apply_patch] }

# Optionnel : hôtes autorisés pour install_skill (site web, GitLab, etc.). Par défaut : GitHub uniquement.
# allowed_skill_install_hosts: []
# Exemple (GitHub + GitLab + votre domaine) : allowed_skill_install_hosts: ["github.com", "raw.githubusercontent.com", "gitlab.com", "mon-entreprise.com"]
# Pour autoriser toute URL HTTPS : allowed_skill_install_hosts: ["*"]
