[workspace]
resolver = "2"
members = [
    "crates/akasha-core",
    "crates/akasha-embedded-llm",
    "crates/akasha-embeddings",
    "crates/akasha-store",
    "crates/akasha-calendar",
    "crates/akasha-tools",
    "crates/akasha-vault",
    "crates/akasha-plugin-api",
    "crates/akasha-plugin-host",
    "crates/akasha-llm",
    "crates/akasha-rag",
    "crates/akasha-cluster",
    "crates/akasha-daemon",
    "crates/akasha-cli",
    "crates/akasha-evals",
    "crates/akasha-tui",
    "crates/akasha-workspace-graph",
]
exclude = [
    "apps/akasha-ui/src-tauri",
]

# Single release version for all workspace crates (CLI, daemon, TUI, libs).
# Keep apps/akasha-ui/package.json + src-tauri/Cargo.toml + tauri.conf.json in sync (crate is excluded from workspace).
[workspace.package]
version = "0.9.0"
