[package]
name = "akasha-workspace-graph"
version.workspace = true
edition = "2021"
description = "Workspace knowledge graph indexer (AST + markdown) for Graphify-style corpus graphs"

[dependencies]
akasha-store = { path = "../akasha-store" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
