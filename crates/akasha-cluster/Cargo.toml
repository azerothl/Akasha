[package]
name = "akasha-cluster"
version = "0.1.0"
edition = "2021"
description = "Cluster mode: NATS, leader election, replication"

[dependencies]
async-nats = "0.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1", features = ["v4"] }
