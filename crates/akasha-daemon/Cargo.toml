[package]
name = "akasha-daemon"
version.workspace = true
edition = "2021"
description = "Akasha 24/7 daemon runtime with supervision"

[features]
default = ["embeddings", "embedded"]
# Embeddings (fastembed + ONNX Runtime) for long-term memory; can cause linker errors on Windows (ort_sys)
embeddings = ["dep:akasha-embeddings", "akasha-embeddings/fastembed"]
# Embeddings via tract-onnx (pure Rust): use on Windows when default embeddings fail to link (e.g. cargo build -p akasha-daemon --no-default-features --features embedded,embeddings-tract)
embeddings-tract = ["dep:akasha-embeddings", "akasha-embeddings/tract"]
# Embedded LLM (Candle, Qwen3 0.6B by default); disable on platforms where Candle is unsupported or not desired
embedded = ["akasha-llm/embedded"]
# Use Baguettotron 321M as embedded model option; set AKASHA_EMBEDDED_MODEL=baguettotron at runtime to select it
embedded-baguettotron = ["akasha-llm/embedded-baguettotron"]
# Use GPU (CUDA) for embedded LLM when available; requires CUDA toolkit at build time
embedded-cuda = ["akasha-llm/embedded-cuda"]
# Intel MKL: faster CPU for embedded LLM (Linux/WSL2). Use when CUDA does not build or on Intel CPUs.
embedded-mkl = ["akasha-llm/embedded-mkl"]

[dependencies]
akasha-core = { path = "../akasha-core" }
akasha-store = { path = "../akasha-store" }
akasha-embeddings = { path = "../akasha-embeddings", optional = true, default-features = false }
akasha-vault = { path = "../akasha-vault" }
akasha-plugin-api = { path = "../akasha-plugin-api" }
akasha-plugin-host = { path = "../akasha-plugin-host" }
akasha-llm = { path = "../akasha-llm" }
akasha-rag = { path = "../akasha-rag" }
akasha-tools = { path = "../akasha-tools", features = ["web", "container"] }
akasha-cluster = { path = "../akasha-cluster" }
async-nats = "0.36"
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rrule = "0.14"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
hmac = "0.12"
sha2 = "0.10"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "http", "builder", "rustls_backend"] }
hex = "0.4"
urlencoding = "2.1"
base64 = "0.22"
pdf-extract = "0.10"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.0", features = ["rt", "time", "macros"] }

[[bench]]
name = "prompt_bench"
harness = false
