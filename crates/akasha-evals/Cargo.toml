[package]
name = "akasha-evals"
version.workspace = true
edition = "2021"
description = "Phase 8 — Evaluation suite: security, runbooks, hallucinations"

[[bin]]
name = "akasha-evals"
path = "src/main.rs"

[dependencies]
akasha-core = { path = "../akasha-core" }
akasha-rag = { path = "../akasha-rag" }
akasha-tools = { path = "../akasha-tools" }
akasha-llm = { path = "../akasha-llm" }
akasha-store = { path = "../akasha-store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
