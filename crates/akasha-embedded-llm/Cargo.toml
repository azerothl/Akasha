[package]
name = "akasha-embedded-llm"
version.workspace = true
edition = "2021"
description = "Embedded LLM via llama-cpp-4 (GGUF), Candle (Qwen3), or Baguettotron"

[features]
default = ["candle"]
# Candle-based inference (Qwen3 0.6B). Fallback CPU backend.
candle = ["dep:candle-pipelines", "dep:candle-core", "dep:candle-nn"]
# Baguettotron 321M for low-resource configs.
baguettotron = ["dep:hf-hub", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:rand"]
# Candle CUDA (legacy; prefer llama-cpp-cuda for GPU).
cuda = ["candle-pipelines/cuda", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers?/mkl"]
# llama-cpp-4 GGUF inference (CPU, native AVX).
llama-cpp = ["dep:llama-cpp-4"]
# NVIDIA GPU via llama.cpp (mutually exclusive with embedded-cuda Candle in release profiles).
llama-cpp-cuda = ["llama-cpp", "llama-cpp-4/cuda"]
# Apple Metal via llama.cpp.
llama-cpp-metal = ["llama-cpp", "llama-cpp-4/metal"]
# HF GGUF download helper (CLI).
download = ["dep:reqwest"]

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
llama-cpp-4 = { version = "0.3", optional = true, default-features = false, features = ["openmp", "native", "mtmd"] }
candle-pipelines = { version = "0.0.7", optional = true, default-features = false }
hf-hub = { version = "0.4", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.19", optional = true }
rand = { version = "0.9", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "embedded_inference"
harness = false

[[example]]
name = "throughput_bench"
required-features = ["llama-cpp"]
