[package]
name = "akasha-embedded-llm"
version = "0.1.0"
edition = "2021"
description = "POC: small embedded LLM via Candle for onboarding, diagnostics, simple replies (Linux/WSL2)"

[features]
default = ["candle"]
# Candle-based inference (Qwen3 0.6B). Recommended: build and run on Linux or WSL2; Windows native may fail to build.
candle = ["dep:candle-pipelines"]
# Baguettotron (321M, PleIAs/Baguettotron) for low-resource or conversation; uses candle-transformers + hf-hub.
baguettotron = ["dep:hf-hub", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:rand", "dep:serde", "dep:serde_json"]

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
# CPU-only; model downloaded from HuggingFace on first use.
candle-pipelines = { version = "0.0.7", optional = true, default-features = false }
hf-hub = { version = "0.4", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.19", optional = true }
rand = { version = "0.9", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
