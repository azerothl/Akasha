[package]
name = "akasha-calendar"
version.workspace = true
edition = "2021"
description = "ICS parsing/serialization and shared calendar types for Akasha"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
