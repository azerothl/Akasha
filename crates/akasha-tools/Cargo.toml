[package]
name = "akasha-tools"
version = "0.1.0"
edition = "2021"
description = "Machine tools for agents: file read/write/search, run command, diff, web fetch; policy and safety"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"], optional = true }
urlencoding = { version = "2", optional = true }
serde_json = { version = "1", optional = true }
url = "2"

[dependencies.tempfile]
version = "3"
optional = true

[features]
default = []
web = ["reqwest", "urlencoding", "serde_json"]
container = ["tempfile"]
