[package]
name = "akasha-llm"
version = "0.1.0"
edition = "2021"
description = "LLM Router: task classifier, multi-provider, fallback, metrics"

[features]
default = []
# Use embedded local model (Candle) for akasha_core when available; recommend Linux/WSL2
embedded = ["dep:akasha-embedded-llm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
akasha-embedded-llm = { path = "../akasha-embedded-llm", optional = true }
