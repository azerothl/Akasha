[package]
name = "akasha-vault"
version = "0.1.0"
edition = "2021"
description = "Local vault for secrets - OS keychain + encrypted file fallback"

[dependencies]
keyring = "2"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rand = "0.8"
