[package]
name = "akasha-cli"
version.workspace = true
edition = "2021"
description = "Akasha CLI - start, stop, doctor"

[[bin]]
name = "akasha"
path = "src/main.rs"

[dependencies]
akasha-core = { path = "../akasha-core" }
akasha-plugin-api = { path = "../akasha-plugin-api" }
akasha-llm = { path = "../akasha-llm" }
akasha-tools = { path = "../akasha-tools" }
akasha-vault = { path = "../akasha-vault" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde_json = "1.0"
anyhow = "1.0"
which = "6.0"
dirs = "5.0"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = "0.4"
